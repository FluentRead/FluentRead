name: Build and deploy documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/core/i18n/messages/brand-taglines.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/testing/run-resource-safe.mjs'
      - 'scripts/verify-docs-build.mjs'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/core/i18n/messages/brand-taglines.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/testing/run-resource-safe.mjs'
      - 'scripts/verify-docs-build.mjs'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        # Website builds do not need WXT entrypoint discovery or local AI binaries.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare website build tools
        run: pnpm rebuild esbuild
      - name: Build documentation
        run: pnpm docs:build
      - name: Check website types
        run: pnpm docs:typecheck
      - name: Check website links and assets
        run: pnpm docs:check
      - name: Upload website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
