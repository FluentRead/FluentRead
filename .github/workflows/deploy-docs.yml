name: Build and deploy documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/core/i18n/messages/brand-taglines.json'
      - 'src/ui/**'
      - 'src/core/i18n/**'
      - 'src/core/config/interfaceAppearance.ts'
      - 'src/core/config/translationLoadingStyle.ts'
      - 'src/core/config/customOpenAI.ts'
      - 'src/core/download/progress.ts'
      - 'src/features/settings/ui/settings-page.css'
      - '.storybook/**'
      - 'storybook/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'wxt.config.ts'
      - 'entrypoints/**'
      - 'scripts/testing/run-resource-safe.mjs'
      - 'scripts/verify-docs-build.mjs'
      - 'scripts/verify-storybook-build.mjs'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/core/i18n/messages/brand-taglines.json'
      - 'src/ui/**'
      - 'src/core/i18n/**'
      - 'src/core/config/interfaceAppearance.ts'
      - 'src/core/config/translationLoadingStyle.ts'
      - 'src/core/config/customOpenAI.ts'
      - 'src/core/download/progress.ts'
      - 'src/features/settings/ui/settings-page.css'
      - '.storybook/**'
      - 'storybook/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'wxt.config.ts'
      - 'entrypoints/**'
      - 'scripts/testing/run-resource-safe.mjs'
      - 'scripts/verify-docs-build.mjs'
      - 'scripts/verify-storybook-build.mjs'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        # Skip third-party install scripts; prepare build tools and WXT types explicitly below.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare website build tools
        run: pnpm rebuild esbuild
      - name: Prepare shared component TypeScript config
        # Shared Vue components inherit the root TypeScript config generated by WXT.
        # The isolated config reads HTML metadata without importing extension workers.
        run: pnpm exec wxt prepare --config .storybook/wxt.config.ts
      - name: Build documentation
        run: pnpm docs:build:site
      - name: Check website types
        run: pnpm docs:typecheck
      - name: Check component preview types
        run: pnpm storybook:typecheck
      - name: Check component preview artifact
        run: pnpm storybook:check
      - name: Check website links and assets
        run: pnpm docs:check
      - name: Upload website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
