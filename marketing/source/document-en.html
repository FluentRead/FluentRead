<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><title>A little curiosity</title><style>body{max-width:750px;margin:36px auto;padding:0 28px;font-family:Arial,'PingFang SC',sans-serif;color:#243044}h1{font-size:28px;line-height:1.4}h2{font-size:22px;margin-top:30px}p{font-size:18px;line-height:1.8}</style><body><h1>一点好奇心，就能带你走很远。</h1><p>钻进一个陌生的话题，是件很有意思的事。一个问题牵出另一个问题，不知不觉，你已经在读一个从前几乎不了解的世界。</p><h2>沿着有意思的地方读下去。</h2><p>读一个好故事，不必一开始就弄懂每个词。从吸引你的那一段开始，读下去，细节自然会慢慢清楚。</p><h2>一个小习惯，一个更大的世界。</h2><p>留下一句让你会心一笑的表达，查查一个还没去过的地方，再多读一段。日常这些小小的好奇，可能就是一天里最有意思的部分。</p><h2>给自己一次细看的机会。</h2><p>有些想法值得多花一点时间。再读一遍原文，试着用自己的话说一说，看看第二次会发现什么。</p></body></html>
